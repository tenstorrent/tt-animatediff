#
# tt-model-manager v5.1 container package for tt-animatediff.
#
#   tt-model package tt_model_package.yaml
#   tt-model serve episod/tt-animatediff-container-v5.1
#
# This is a DIFFUSION model, so it uses `kind: tt-dit-server` rather than either vLLM
# kind: there are no tokens, no KV cache and no continuous batching, so the whole engine
# layer means nothing to it. What it needs instead is a warm pipeline behind a small HTTP
# surface, which animatediff_ttnn/server/app.py provides.

schema: "5.1"
name: tt-animatediff
# NOT episod/tt-animatediff: that repo holds the v6 thin bundle (tt_kernel_manifest.json, run.sh,
# wheels/) and the diffusers custom pipeline. Pushing this v5.1 container manifest there would
# overwrite the thin bundle's manifest and card, so the container package has its own repo.
repo: episod/tt-animatediff-container-v5.1
# The repo the SERVED path actually loads: SD 1.4's UNet, VAE and tokenizer, pulled by
# generation_helpers.load_sd14_ttnn. It said `guoyww/animatediff`, which is a repo of raw
# mm_sd_v*.ckpt motion modules -- not diffusers format, and not loaded here at all. That
# was wrong in both directions: a pre-caching deploy fetched gigabytes it never uses and
# still missed the repo it needs, so a restricted-egress start would fail; and HF_MODEL
# comes from this field, so /v1/models named a model nobody had loaded.
#
# No motion adapter is declared because the served path (Phase 2.5, generate_frames_temporal)
# does not use one -- its cross-frame motion comes from temporal_alpha. The adapter in
# motion_weights.py belongs to the Phase 3 CLI path, which this server does not run.
weights: CompVis/stable-diffusion-v1-4
kind: tt-dit-server
arch: blackhole

source:
  # ttnn itself is built from this tree in the image.
  tt_metal:
    repo: https://github.com/tenstorrent/tt-metal
    ref: v0.77.0
  code:
    # The image DELETES tt-metal's own models/ and copies this allowlist in as the only
    # `models` package there is (see the Dockerfile's metal-local stage), so this list is
    # not a hint -- it is the whole tree the server gets.
    #
    # models/common is not imported by animatediff_ttnn directly; the SD demo below pulls
    # it in. The demo IS the model: load_sd14_ttnn, the schedulers, the VAE and the UNet
    # all come from models/demos/vision/generative/stable_diffusion/wormhole (32 files,
    # the transitive closure of every `models.*` import under animatediff_ttnn/).
    #
    # The kind's verify step CANNOT catch a miss here for this model. It imports the ASGI
    # attribute, and app.py deliberately defers every ttnn and model import into a
    # function so the module is importable on a machine with no card -- so nothing
    # touches models.demos until the lifespan warms the pipeline, by which point the
    # image has shipped. tests/test_server_app.py guards the list instead.
    - models/common
    - models/demos/vision/generative/stable_diffusion/wormhole
  # The model's own package does NOT live in tt-metal -- it is this repo. `extra_code`
  # ships it from here, pinned to a ref so the package is reproducible by whoever pulls
  # it and not only by the machine that built it.
  extra_code:
    - root:
        repo: https://github.com/tenstorrent/tt-animatediff
        # A COMMIT, not a tag, and deliberately: no tag carries animatediff_ttnn/server
        # yet. v0.10.0 sat here and predates the ASGI app entirely, so a consumer staging
        # this manifest would have got a code tree with no runtime.app in it -- and the
        # kind's verify step imports that attribute, so the failure would have landed in
        # their image build.
        #
        # This lags the branch by one commit BY CONSTRUCTION: a pin can only name a commit
        # that already exists, so a change to animatediff_ttnn/ and the repin of this line
        # are always two commits. That is not a wrinkle to tidy up -- it is why the guard
        # below exists, and why it must be run after committing rather than before.
        #
        # It must also name a commit REACHABLE FROM MAIN, which is a separate trap and a
        # sharper one. #9 was squash-merged, so every commit on the branch is now dangling;
        # the previous pin (d89a90c) survived only because origin/feat/asgi-server had not
        # been deleted yet. stage() runs "git clone --filter=blob:none" and then
        # "git checkout <ref>", so the moment that branch is pruned, EVERY consumer's
        # "tt-model package" fails on a ref the server no longer has. Pinned to the squash
        # commit on main instead, which cannot be pruned.
        #
        # Now the v0.11.2 release tag (docs/RELEASING.md step 5); repin it each release.
        # What actually matters is not tag
        # versus sha but that the ref is reachable and names the animatediff_ttnn/ tree
        # being shipped. Both are now asserted in test_server_app.py
        # (..._ships_the_package_we_are_developing and ..._is_reachable_from_head), and both
        # skip on a shallow clone -- which is why the serve-contract job checks out with
        # fetch-depth: 0.
        # 2026-10-14: 7b4772f, the head of feat/lora-support carrying the v0.13.1 review fixes (the
        # first package was built from fb9ef60, v0.13.0). animatediff_ttnn/ at this commit is the
        # tree being shipped. It is NOT yet
        # reachable from main (PR #15 is unmerged and will be squashed), so after the merge
        # repin this to the release tag or the squash commit (docs/RELEASING.md step 5); until then
        # a fresh `tt-model package` works only while the branch exists on GitHub.
        ref: 7b4772f9c504e43d980e336f39588d08fe09c34d
      paths:
        - animatediff_ttnn
  ubuntu: "22.04"
  python: "3.12"

runtime:
  # Resolved by uvicorn exactly as written; covered by source.extra_code above.
  app: animatediff_ttnn.server.app:app
  # The kind's default is FLUX2_MESH_SHAPE, which means nothing to this model. The server
  # reads the name below and refuses a malformed value rather than defaulting -- an
  # unnoticed (1,1) would convert against the wrong mesh and return bad frames, not an error.
  mesh_shape_env: ANIMATEDIFF_MESH_SHAPE
  # Beyond the kind's own fastapi/uvicorn/pydantic/pillow. torch comes from the image's
  # CPU build (the kind's verify step asserts +cpu and tt-metal's pin), so it is not listed.
  # The lock IS the dependency set when present -- nothing resolves at build time, so two
  # builds a week apart produce the same environment. Kept alongside the ranges below
  # rather than replacing them: the ranges document intent and are what a human reads,
  # the lock is what the image installs, and `packages` is still what gets re-resolved if
  # the lock is ever regenerated.
  lock: tt_model_package.lock
  # Upper bounds for the same reason hf/requirements.txt has them: unbounded floors are
  # what broke the demo Space four deploys running, each time on a new major arriving
  # under a `>=`. In a container the failure is worse than on a Space, because it is
  # DELAYED and lands elsewhere: the image builds fine, the kind's verify step passes (it
  # imports the ASGI module, which defers every model import), and it fails in the
  # lifespan on a consumer's box weeks later. Capping at the next major is the floor of
  # what this needs; requirements.lock is the ceiling (see runtime.lock below).
  packages:
    - diffusers>=0.32.1,<0.41
    - transformers>=4.30.0,<6
    - accelerate>=0.20.0,<2
    - safetensors>=0.4.0,<1
    # LoRA merge (animatediff_ttnn.lora, ANIMATEDIFF_LORAS). diffusers imports it lazily, so
    # its absence passes the build-time verify and fails on the first LoRA load.
    - peft>=0.15,<1

serve:
  # ONE chip, and that is the model's limit rather than a conservative default.
  # Declared P300x2 (four chips) first, and a real serving attempt failed in the lifespan:
  #   TT_FATAL: Can't convert a tensor distributed on MeshShape([1, 4]) mesh to
  #   row-major logical tensor. Supply a mesh composer to concatenate multi-device shards.
  # The device opened and the weights loaded; it is load_sd14_ttnn's tensors that are not
  # sharded. animatediff_ttnn's working path hardcodes device_ids=[0], and mesh sharding is
  # still a design doc (docs/superpowers/plans/2026-06-15-mesh-frame-sharding.md), not a
  # shipped capability. Raise this only alongside that work, and re-run the serve.
  hardware: p150
  mesh_device: P150
  port: 8000

# `tt-model serve` has no --env option and forwards only HF_TOKEN from the host, so a
# serve profile is the only way the operator-side switches reach the container:
# ANIMATEDIFF_LORAS (a named catalog; a request picks a name, never a repo id or path) and
# ANIMATEDIFF_MOTION_ADAPTER (loads the Phase 3 adapter). The consumer chooses with
# `tt-model serve episod/tt-animatediff-container-v5.1 --profile plain`. A different catalog is a repackage,
# because the values are part of the published manifest.
#
# `full` is the default so a first-time consumer gets every feature. It downloads the LoRA files
# and the motion adapter from the Hub at startup and keeps three more UNets resident
# (about 7 s each to load), and a catalog entry that fails to load stops the server before it
# reports ready. `plain` is the same image without any of that, for a box with no route to the
# Hub beyond the SD 1.4 weights or one that wants the fastest start.
# tests/test_server_app.py parses every profile's catalog with the server's own parser.
serve_profiles:
  - name: plain
    description: The plain model only. No LoRA catalog and no motion adapter.
  - name: full
    description: Plain model plus a LoRA catalog (pixel, pixel-fast, lcm) and the Phase 3 motion adapter.
    env:
      ANIMATEDIFF_MOTION_ADAPTER: default
      ANIMATEDIFF_LORAS: '{"pixel": "artificialguybr/pixelartredmond-1-5v-pixel-art-loras-for-sd-1-5:PixelArtRedmond15V-PixelArt-PIXARFK.safetensors", "pixel-fast": ["artificialguybr/pixelartredmond-1-5v-pixel-art-loras-for-sd-1-5:PixelArtRedmond15V-PixelArt-PIXARFK.safetensors", "latent-consistency/lcm-lora-sdv1-5:pytorch_lora_weights.safetensors"], "lcm": "latent-consistency/lcm-lora-sdv1-5:pytorch_lora_weights.safetensors"}'
default_profile: full

card:
  description: >
    AnimateDiff text-to-video on Tenstorrent Blackhole: a TTNN Stable Diffusion 1.4 UNet with
    cross-frame temporal attention, served over HTTP as 512x512 GIF loops. Offers style LoRAs,
    LCM-LoRA fast sampling, prompt travel, latent chaining, per-step previews and an optional
    MotionAdapter.
  performance: >
    One Blackhole chip of a P300c pair, 8 frames at 512x512, warm, median of 3: 15.3 s at 25
    steps, 12.8 s at 20, 8.7 s at 12. A style LoRA costs +0.5 s. An LCM variant runs 4 steps in
    4.1 s (3.7x faster than 25 steps); style + LCM takes 4.3 s. Prompt schedule +0.2 s, chaining
    +0.1 s, per-step preview +4.9 s at 20 steps. The first request after start compiles kernels
    and took 119.6 s. Measured through this container image with scripts/benchmark_modes.py
    (docs/LORA.md, "Every served mode, timed").
  limitations: >
    One chip, 512x512 only. LoRAs must be single kohya-format SD 1.5 UNet files; SDXL, LoHa, LoKr
    and DoRA files are refused at startup. LCM clips are less frame-coherent than 25-step clips.
    The MotionAdapter takes about 24 s for 2 frames at 6 steps with nothing skipped (alpha 0 is
    just as slow) and 3.4 s with up1 and up2 skipped. The first request to each LoRA variant is
    about 1.4 s slower than the following ones. No CPU, simulator or Lightning-UNet modes here.
  risks: >
    The full profile downloads third-party LoRA files and the motion adapter from the Hugging
    Face Hub at startup, and a file that fails to load stops the server before it reports ready.
    Check each LoRA's own license before use. Output is AI-generated video and can reproduce
    biases of the SD 1.4 training data.
  architecture: Stable Diffusion 1.4 UNet (TTNN) with cross-frame temporal attention
  status: Community bring-up, validated on one Blackhole chip
  intended_use: Short looping text-to-video clips, style experiments with SD 1.5 LoRAs, and fast previews with LCM.
  out_of_scope_use: >
    Image-to-video, resolutions other than 512x512, multi-chip or multi-user throughput, and
    SDXL checkpoints or LoRAs.
  usage: |
    `POST /v1/videos/generations` returns a base64 GIF. Fields beyond `prompt`, `num_frames`,
    `num_inference_steps`, `guidance_scale` and `seed`: `lora` (a name from `GET /v1/models`),
    `prompt_schedule`, `sampler` (`pndm` or `euler`), `chain_save` / `chain_from` / `chain_alpha`,
    `motion_adapter` (+ `_alpha`, `_skip`), `preview` / `preview_every` (read progress from
    `GET /v1/videos/preview`) and `temporal_alpha`. The `full` profile (default) offers the
    `pixel`, `pixel-fast` and `lcm` LoRA variants and the motion adapter; `--profile plain` offers
    neither. A variant that includes the LCM-LoRA defaults to 4 steps and guidance 1.5 when the
    request leaves them out.
  licensing: >
    The weights are CompVis/stable-diffusion-v1-4 under the CreativeML OpenRAIL-M license,
    fetched at start and not bundled. The TTNN port and serving code in `code/` are Apache-2.0.
    LoRA files carry their own licenses.
  related: Source and docs at https://github.com/tenstorrent/tt-animatediff. The diffusers custom pipeline and v6 thin bundle are `episod/tt-animatediff`.
  license:
    id: creativeml-openrail-m
  pipeline_tag: text-to-video
  base_model: [CompVis/stable-diffusion-v1-4]
