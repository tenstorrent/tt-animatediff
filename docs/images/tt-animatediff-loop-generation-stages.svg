<svg xmlns="http://www.w3.org/2000/svg" width="2400" height="1120" viewBox="0 0 2400 1120" role="img" aria-labelledby="title desc">
  <title id="title">tt-animatediff loop generation stages</title>
  <desc id="desc">A left-to-right infographic showing CPU AnimateDiff, Blackhole TTNN, temporal blending, MotionAdapter injection, and mesh frame sharding leading to a looping animated GIF.</desc>
  <defs>
    <linearGradient id="bg" x1="0" x2="1" y1="0" y2="1">
      <stop offset="0" stop-color="#08131f"/>
      <stop offset="1" stop-color="#10283a"/>
    </linearGradient>
    <linearGradient id="hero" x1="0" x2="1">
      <stop offset="0" stop-color="#42d6c5"/>
      <stop offset="1" stop-color="#79a9ff"/>
    </linearGradient>
    <filter id="shadow" x="-20%" y="-20%" width="140%" height="150%">
      <feDropShadow dx="0" dy="10" stdDeviation="12" flood-color="#020912" flood-opacity=".45"/>
    </filter>
    <marker id="arrow" markerWidth="12" markerHeight="12" refX="10" refY="6" orient="auto">
      <path d="M0,0 L12,6 L0,12 Z" fill="#8bb6ca"/>
    </marker>
    <marker id="loop-arrow" markerWidth="14" markerHeight="14" refX="11" refY="7" orient="auto">
      <path d="M0,0 L14,7 L0,14 Z" fill="#42d6c5"/>
    </marker>
    <pattern id="mesh" width="24" height="24" patternUnits="userSpaceOnUse">
      <rect width="24" height="24" rx="4" fill="#18394e"/>
      <rect x="4" y="4" width="16" height="16" rx="3" fill="#2a6179" stroke="#6de0d0" stroke-width="1"/>
      <circle cx="12" cy="12" r="2" fill="#d9fff8"/>
    </pattern>
    <style>
      .eyebrow { font: 700 18px 'Segoe UI', Arial, sans-serif; letter-spacing: 3px; text-transform: uppercase; fill: #8bb6ca; }
      .title { font: 800 52px 'Segoe UI', Arial, sans-serif; fill: #f2fbff; }
      .subtitle { font: 400 23px 'Segoe UI', Arial, sans-serif; fill: #b9cfdb; }
      .phase { font: 800 24px 'Segoe UI', Arial, sans-serif; fill: #f2fbff; }
      .card-title { font: 750 27px 'Segoe UI', Arial, sans-serif; fill: #f2fbff; }
      .body { font: 400 19px 'Segoe UI', Arial, sans-serif; fill: #c6d8e2; }
      .small { font: 400 16px 'Segoe UI', Arial, sans-serif; fill: #9eb8c7; }
      .code { font: 600 16px 'SFMono-Regular', Consolas, monospace; fill: #8cf1df; }
      .label { font: 700 15px 'Segoe UI', Arial, sans-serif; letter-spacing: 1px; fill: #b9cfdb; }
      .footer { font: 400 17px 'Segoe UI', Arial, sans-serif; fill: #a9c2d0; }
    </style>
  </defs>

  <rect width="2400" height="1120" fill="url(#bg)"/>
  <path d="M0 140 H2400" stroke="#295066" stroke-width="2"/>
  <text x="100" y="66" class="eyebrow">TENSTORRENT · ANIMATEDIFF</text>
  <text x="100" y="123" class="title">From prompt to a looping GIF</text>
  <text x="100" y="174" class="subtitle">The canonical evolution of loop generation — from a CPU baseline to Blackhole mesh execution.</text>

  <!-- Flow arrows behind cards -->
  <g fill="none" stroke="#8bb6ca" stroke-width="5" marker-end="url(#arrow)" opacity=".9">
    <path d="M445 530 H492"/>
    <path d="M895 530 H942"/>
    <path d="M1345 530 H1392"/>
    <path d="M1795 530 H1842"/>
  </g>

  <!-- Phase cards -->
  <g filter="url(#shadow)">
    <rect x="70" y="230" width="375" height="600" rx="22" fill="#142b3b" stroke="#67d6c6" stroke-width="3"/>
    <rect x="520" y="230" width="375" height="600" rx="22" fill="#172b43" stroke="#78a9ff" stroke-width="3"/>
    <rect x="970" y="230" width="375" height="600" rx="22" fill="#272b48" stroke="#b79cff" stroke-width="3"/>
    <rect x="1420" y="230" width="375" height="600" rx="22" fill="#3a2d3d" stroke="#ffbd79" stroke-width="3"/>
    <rect x="1870" y="230" width="375" height="600" rx="22" fill="#183b42" stroke="#72e3b2" stroke-width="3"/>
  </g>

  <!-- Phase 1 -->
  <text x="105" y="282" class="phase" fill="#67d6c6">PHASE 1</text>
  <text x="105" y="325" class="card-title">CPU baseline</text>
  <text x="105" y="365" class="small">Full AnimateDiff pipeline</text>
  <g transform="translate(105 405)">
    <rect width="72" height="52" rx="8" fill="#244b55" stroke="#67d6c6" stroke-width="2"/>
    <path d="M18 17h36M18 27h36M18 37h23" stroke="#d9fff8" stroke-width="4" stroke-linecap="round"/>
    <text x="88" y="24" class="label">PROMPT</text><text x="88" y="46" class="small">text conditioning</text>
  </g>
  <path d="M141 480v28" stroke="#67d6c6" stroke-width="3" marker-end="url(#arrow)"/>
  <g transform="translate(105 530)">
    <rect width="72" height="56" rx="8" fill="#244b55" stroke="#67d6c6" stroke-width="2"/>
    <path d="M16 42V22l12-10 12 10 16-14v34z" fill="none" stroke="#d9fff8" stroke-width="3"/>
    <text x="88" y="24" class="label">UNET</text><text x="88" y="46" class="small">denoise on CPU</text>
  </g>
  <text x="105" y="640" class="body">Full MotionAdapter adds</text>
  <text x="105" y="669" class="body">temporal coherence.</text>
  <text x="105" y="718" class="body">VAE decodes frames, then</text>
  <text x="105" y="747" class="body">they assemble into a GIF.</text>
  <text x="105" y="790" class="code">generate_baseline.py</text>

  <!-- Phase 2 -->
  <text x="555" y="282" class="phase">PHASE 2</text>
  <text x="555" y="325" class="card-title">Blackhole TTNN UNet</text>
  <text x="555" y="365" class="small">Spatial denoising acceleration</text>
  <g transform="translate(555 405)">
    <rect width="74" height="58" rx="9" fill="#243e68" stroke="#78a9ff" stroke-width="2"/>
    <rect x="20" y="17" width="34" height="25" rx="3" fill="none" stroke="#d9e7ff" stroke-width="3"/>
    <path d="M14 22h6M54 22h6M14 36h6M54 36h6" stroke="#d9e7ff" stroke-width="3"/>
    <text x="91" y="24" class="label">BLACKHOLE</text><text x="91" y="46" class="small">TTNN device</text>
  </g>
  <path d="M591 485v28" stroke="#78a9ff" stroke-width="3" marker-end="url(#arrow)"/>
  <text x="555" y="568" class="body">Frames run sequentially</text>
  <text x="555" y="597" class="body">through the TTNN UNet.</text>
  <text x="555" y="646" class="body">Decode on the host, then</text>
  <text x="555" y="675" class="body">assemble the looping output.</text>
  <text x="555" y="790" class="code">generate_blackhole.py</text>

  <!-- Phase 2.5 -->
  <text x="1005" y="282" class="phase">PHASE 2.5</text>
  <text x="1005" y="325" class="card-title">Temporal blend</text>
  <text x="1005" y="365" class="small">Default Blackhole path</text>
  <g transform="translate(1005 405)">
    <circle cx="35" cy="29" r="25" fill="#443b70" stroke="#b79cff" stroke-width="2"/>
    <path d="M24 29h22M35 18v22" stroke="#eadfff" stroke-width="3"/>
    <path d="M8 10c17-19 51-14 58 8M62 48c-17 19-51 14-58-8" fill="none" stroke="#d1c0ff" stroke-width="3" marker-end="url(#arrow)"/>
    <text x="91" y="24" class="label">CROSS-FRAME</text><text x="91" y="46" class="small">temporal attention</text>
  </g>
  <text x="1005" y="540" class="body">TTNN UNet inference plus</text>
  <text x="1005" y="569" class="body">cross-frame blending keeps</text>
  <text x="1005" y="598" class="body">motion consistent between</text>
  <text x="1005" y="627" class="body">sequentially generated frames.</text>
  <rect x="1005" y="687" width="214" height="42" rx="8" fill="#443b70" stroke="#b79cff"/>
  <text x="1023" y="714" class="code">--temporal-alpha</text>
  <text x="1005" y="790" class="code">generate_blackhole_v2.py</text>

  <!-- Phase 3 -->
  <text x="1455" y="282" class="phase">PHASE 3</text>
  <text x="1455" y="325" class="card-title">MotionAdapter on Blackhole</text>
  <text x="1455" y="365" class="small">Spatial device + CPU temporal injection</text>
  <g transform="translate(1455 405)">
    <rect width="74" height="54" rx="8" fill="#57404d" stroke="#ffbd79" stroke-width="2"/>
    <path d="M18 17h38M18 28h38M18 39h25" stroke="#ffe7c5" stroke-width="4" stroke-linecap="round"/>
    <text x="91" y="24" class="label">7 INJECTION POINTS</text><text x="91" y="46" class="small">temporal blocks</text>
  </g>
  <path d="M1491 480v30" stroke="#ffbd79" stroke-width="3" marker-end="url(#arrow)"/>
  <text x="1455" y="553" class="body">forward_unet_staged()</text>
  <text x="1455" y="582" class="body">replaces TTNN __call__.</text>
  <text x="1455" y="631" class="body">_apply_temporal() round-trips</text>
  <text x="1455" y="660" class="body">to CPU for the full diffusers</text>
  <text x="1455" y="689" class="body">AnimateDiffTransformer3D.forward().</text>
  <rect x="1455" y="730" width="210" height="42" rx="8" fill="#57404d" stroke="#ffbd79"/>
  <text x="1473" y="757" class="code">--motion-adapter</text>

  <!-- Phase 4 -->
  <text x="1905" y="282" class="phase">PHASE 4</text>
  <text x="1905" y="325" class="card-title">Mesh frame sharding</text>
  <text x="1905" y="365" class="small">Optimization path, not a separate script</text>
  <rect x="1905" y="405" width="210" height="84" rx="10" fill="url(#mesh)" stroke="#72e3b2" stroke-width="2"/>
  <text x="2137" y="430" class="label">BLACKHOLE</text><text x="2137" y="454" class="small">mesh</text>
  <text x="1905" y="535" class="body">Shard frames across chips</text>
  <text x="1905" y="564" class="body">in chunks from</text>
  <text x="1905" y="593" class="code">plan_frame_sharding</text>
  <text x="1905" y="642" class="body">Gather → VAE decode on</text>
  <text x="1905" y="671" class="body">the TTNN mesh (CPU fallback</text>
  <text x="1905" y="700" class="body">if needed) → assembly.</text>
  <text x="1905" y="790" class="code">mesh-sharding optimization</text>

  <!-- CPU/device distinction callout -->
  <rect x="1420" y="865" width="825" height="78" rx="14" fill="#251e2b" stroke="#ffbd79" stroke-width="2"/>
  <circle cx="1452" cy="904" r="12" fill="#ffbd79"/>
  <text x="1480" y="897" class="label">KEY DISTINCTION</text>
  <text x="1480" y="923" class="small">UNet denoising stays on Blackhole; MotionAdapter temporal processing is injected from CPU.</text>

  <!-- Output -->
  <path d="M2245 530 C2300 530 2310 530 2335 530" fill="none" stroke="#42d6c5" stroke-width="5" marker-end="url(#loop-arrow)"/>
  <g transform="translate(2295 392)">
    <rect width="90" height="120" rx="12" fill="#143d43" stroke="#42d6c5" stroke-width="3"/>
    <rect x="14" y="18" width="62" height="76" rx="6" fill="#276c70"/>
    <path d="M21 79l15-22 12 12 11-20 11 30z" fill="#9cf7df"/>
    <circle cx="68" cy="30" r="5" fill="#f6d66e"/>
    <text x="45" y="113" text-anchor="middle" class="label">GIF</text>
  </g>
  <path d="M2370 365 C2425 270 2320 202 2245 265" fill="none" stroke="#42d6c5" stroke-width="4" marker-end="url(#loop-arrow)"/>
  <text x="2292" y="585" class="label">LOOPING OUTPUT</text>
  <text x="2292" y="610" class="small">frames → GIF → repeat</text>

  <!-- Legend and footer -->
  <rect x="70" y="900" width="1280" height="106" rx="16" fill="#0d202e" stroke="#295066" stroke-width="2"/>
  <text x="100" y="934" class="label">LEGEND</text>
  <rect x="100" y="956" width="24" height="24" rx="5" fill="#244b55" stroke="#67d6c6" stroke-width="2"/>
  <text x="137" y="974" class="small">CPU</text>
  <rect x="220" y="956" width="24" height="24" rx="5" fill="#243e68" stroke="#78a9ff" stroke-width="2"/>
  <text x="257" y="974" class="small">single Blackhole</text>
  <rect x="430" y="956" width="24" height="24" rx="5" fill="url(#mesh)" stroke="#72e3b2" stroke-width="2"/>
  <text x="467" y="974" class="small">Blackhole mesh</text>
  <rect x="650" y="956" width="24" height="24" rx="5" fill="#143d43" stroke="#42d6c5" stroke-width="2"/>
  <text x="687" y="974" class="small">decoded output</text>
  <path d="M850 968h45" stroke="#8bb6ca" stroke-width="4" marker-end="url(#arrow)"/>
  <text x="914" y="974" class="small">data flow</text>
  <text x="100" y="1048" class="footer">Entry points: <tspan class="code">generate_baseline.py</tspan> · <tspan class="code">generate_blackhole.py</tspan> · <tspan class="code">generate_blackhole_v2.py --temporal-alpha</tspan> · <tspan class="code">generate.py --motion-adapter</tspan> · <tspan class="code">plan_frame_sharding</tspan></text>
  <text x="1200" y="1085" text-anchor="end" class="small">tt-animatediff · canonical generation paths</text>
</svg>
