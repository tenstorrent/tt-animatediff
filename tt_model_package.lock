# matching how the tt-dit-server kind installs it. Regenerate the same way; do not hand-edit.
#
# WHY A LOCK AND NOT JUST RANGES. With runtime.lock set, the kind's install step is ONLY
# this file -- so it names the whole environment, including the fastapi/uvicorn/pydantic/
# pillow stack the kind would otherwise add by default and the torch pin it would otherwise
# inject from tt-metal. Measured reason it earns its place: resolving the manifest's ranges
# alone pulls torch 2.14.0 (accelerate depends on torch and nothing bounds it) plus the
# entire CUDA wheel set -- nvidia-*, triton, cuda-toolkit -- into a CPU-only serving image.
# This lock pins torch==2.11.0+cpu, which is tt-metal v0.77.0's pin and exactly what the
# kind's verify step asserts, and carries no CUDA wheels at all.
#
# NOT YET BUILT. No image has been built from this manifest, so the lock is verified only
# as far as resolution: it compiles, and it pins the torch the verify step demands. The
# first `tt-model package` run is what proves it installs.
#
#
# pytest IS IN HERE ON PURPOSE, and it is the one line in this file that should be deleted
# rather than maintained. tt-metal v0.77.0's models/common/utility_functions.py has
# `import pytest` at module scope (line 12), and that file ships in this package's code
# allowlist -- models/demos/.../wormhole/common.py does
# `from models.common.utility_functions import is_blackhole`. So the container's lifespan
# dies with ModuleNotFoundError: No module named 'pytest' the moment it opens the device.
# A host serve never sees it, because tt-metal's python_env has pytest installed: the same
# works-on-host, dies-in-image shape as the under-shipped allowlist this manifest already
# carries a comment about. Confirmed in a real container build by a colleague.
#
# Fixed upstream by tt-metal fdcb5cf2ec6c ("Remove pytest runtime dependency from model
# utilities", #55079, merged 2026-09-03), which moves the import inside the one function
# that needs it -- verified against the file at that commit. No RELEASE TAG carries it yet;
# v0.78.0 still has the module-level import. So the alternatives were: ship pytest, or jump
# source.tt_metal.ref 58 days past a tag onto a bare commit. Shipping pytest is the smaller
# blast radius -- it moves nothing in the runtime, and every hardware measurement and
# quality claim in this repo was taken against v0.77.0.
#
# DELETE pytest, iniconfig and pluggy from lock.in and regenerate the moment a tt-metal tag
# carries fdcb5cf. tests/test_server_app.py::test_the_lock_ships_pytest_only_while_tt_metal_needs_it
# is the reminder.
# transformers==5.16.1 is what the ranges already resolve to, with or without this lock,
# and the Blackhole serving path has NOT been exercised against transformers 5.x -- the
# hardware serves in this branch all ran 4.52.4. The lock makes that visible and
# reproducible rather than resolving differently on every build; it does not bless it.
