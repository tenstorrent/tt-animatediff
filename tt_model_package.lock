#
# WHY A LOCK AND NOT JUST RANGES. With runtime.lock set, the kind's install step is ONLY
# this file -- so it names the whole environment, including the fastapi/uvicorn/pydantic/
# pillow stack the kind would otherwise add by default and the torch pin it would otherwise
# inject from tt-metal. Measured reason it earns its place: resolving the manifest's ranges
# alone pulls torch 2.14.0 (accelerate depends on torch and nothing bounds it) plus the
# entire CUDA wheel set -- nvidia-*, triton, cuda-toolkit -- into a CPU-only serving image.
# This lock pins torch==2.11.0+cpu, which is tt-metal v0.77.0's pin and exactly what the
# kind's verify step asserts, and carries no CUDA wheels at all.
#
# NOT YET BUILT. No image has been built from this manifest, so the lock is verified only
